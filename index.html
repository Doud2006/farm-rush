<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#234b2a">
<title>Farm Rush V2 Alpha 2</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#18391f;
}

button,select{
font:inherit;
}

.hidden{
display:none!important;
}

/* ROTATION */

#rotate{
display:none;
position:fixed;
inset:0;
z-index:999;
background:linear-gradient(#81cf63,#d9f2a9);
color:#214624;
align-items:center;
justify-content:center;
text-align:center;
padding:28px;
}

.rotateCard{
background:#fff8dc;
border:3px solid #6a9b4d;
border-radius:28px;
padding:25px;
max-width:340px;
box-shadow:0 12px 30px #0003;
}

.rotatePhone{
font-size:70px;
animation:rot 1.7s ease-in-out infinite;
}

@keyframes rot{
50%{transform:rotate(90deg)}
}

@media(orientation:portrait) and (max-width:900px){
#rotate{display:flex}
}

/* ACCUEIL */

#home,#game{
position:fixed;
inset:0;
}

.sky{
position:absolute;
inset:0;
background:linear-gradient(#79cfff 0 47%,#78c45c 47%);
}

.sun{
position:absolute;
right:9%;
top:8%;
width:70px;
height:70px;
border-radius:50%;
background:#ffe36f;
box-shadow:0 0 0 12px #fff17833;
}

.cloud{
position:absolute;
font-size:55px;
animation:cloud 26s linear infinite;
}

.c1{
top:9%;
left:-10%;
}

.c2{
top:24%;
left:45%;
animation-duration:34s;
animation-delay:-8s;
}

@keyframes cloud{
to{transform:translateX(115vw)}
}

.homeFarm{
position:absolute;
left:50%;
bottom:-48%;
width:1050px;
height:720px;
transform:translateX(-50%) rotateX(62deg) rotateZ(45deg);
background:repeating-linear-gradient(
0deg,
#67b84e 0 55px,
#72c257 55px 110px
);
border-radius:100px;
}

.decor{
position:absolute;
filter:drop-shadow(0 13px 5px #0004);
animation:bob 2.5s ease-in-out infinite;
}

@keyframes bob{
50%{transform:translateY(-5px)}
}

.dHouse{
left:15%;
bottom:18%;
font-size:105px;
}

.dTractor{
right:12%;
bottom:15%;
font-size:85px;
}

.dChicken{
right:31%;
bottom:11%;
font-size:48px;
}

.dTree{
left:5%;
bottom:8%;
font-size:90px;
}

.homeUI{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.logo{
font-weight:1000;
font-size:clamp(50px,9vw,96px);
color:#fff7c7;
text-shadow:
0 5px #397439,
0 9px #235526,
0 13px 20px #0005;
transform:rotate(-2deg);
}

.logo span{
color:#ffd34e;
}

.tag{
background:#ffffffdf;
color:#315c31;
padding:8px 16px;
border-radius:30px;
font-weight:900;
margin:8px 0 18px;
}

.play{
border:3px solid #fff0aa;
border-radius:20px;
background:linear-gradient(#76d052,#3e9635);
color:#fff;
padding:14px 48px;
font-size:22px;
font-weight:1000;
box-shadow:
0 7px #245f27,
0 12px 22px #0004;
}

.play:active{
transform:translateY(4px);
}

.homeBottom{
position:absolute;
left:15px;
right:15px;
bottom:12px;
display:flex;
justify-content:space-between;
color:#26502b;
font-size:11px;
}

.sound{
width:44px;
height:44px;
border-radius:50%;
border:2px solid #fff2b9;
background:#3c713f;
color:#fff;
font-size:20px;
}

/* JEU */

#game{
display:none;
background:#70bd56;
}

.viewport{
position:absolute;
inset:0;
overflow:hidden;
background:linear-gradient(#7acdfa 0 13%,#74be56 13%);
}

#world{
position:absolute;
width:960px;
height:540px;
transform-origin:0 0;
background:linear-gradient(#7ccff9 0 13%,#73bc54 13%);
overflow:hidden;
}

.hill{
position:absolute;
left:-80px;
right:-80px;
bottom:-245px;
height:640px;
border-radius:50% 50% 0 0 / 15% 15% 0 0;
background:#76bd55;
box-shadow:inset 0 -20px #66ac4c;
}

.road{
position:absolute;
left:130px;
top:355px;
width:700px;
height:65px;
border-radius:50%;
background:#d5b77f;
transform:rotate(-7deg);
}

.pond{
position:absolute;
right:70px;
top:300px;
width:145px;
height:76px;
border-radius:50%;
background:#5fc0db;
border:8px solid #ddcc8c;
}

.tree{
position:absolute;
font-size:58px;
filter:drop-shadow(0 10px 4px #0003);
}

.t1{
left:60px;
top:140px;
}

.t2{
right:70px;
top:125px;
}

.t3{
right:175px;
top:95px;
}

/* CHAMPS */

#fieldLayer{
position:absolute;
inset:0;
z-index:5;
touch-action:auto;
}

#fieldLayer.paint-mode{
touch-action:none;
}

.plot{
position:absolute;
width:78px;
height:40px;
border:0;
clip-path:polygon(
50% 0,
100% 50%,
50% 100%,
0 50%
);
background:#87532f;
color:#fff;
display:grid;
place-items:center;
filter:drop-shadow(0 3px 1px #4a2d1b);
user-select:none;
-webkit-user-select:none;
}

.plot:before{
content:"";
position:absolute;
inset:4px;
clip-path:inherit;
background:#9f673b;
}

.plot.locked:before{
background:#72786b;
}

.plot.ready:before{
background:#b17a37;
}

.crop{
position:relative;
z-index:2;
font-size:24px;
transform:translateY(-4px);
pointer-events:none;
}

.timer{
position:absolute;
z-index:3;
bottom:2px;
background:#fff;
color:#30422e;
border-radius:8px;
padding:1px 5px;
font-size:8px;
font-weight:900;
pointer-events:none;
}

/* BATIMENTS */

.building{
position:absolute;
z-index:8;
border:0;
background:none;
color:#fff;
text-align:center;
filter:drop-shadow(0 12px 4px #0003);
}

.building .icon{
display:block;
font-size:62px;
}

.building .label{
background:#264e2dda;
border:2px solid #fff3bf;
border-radius:12px;
padding:3px 7px;
font-size:9px;
font-weight:1000;
}

.building.locked{
filter:grayscale(.8) drop-shadow(0 12px 4px #0003);
opacity:.65;
}

.badge{
position:absolute;
right:-4px;
top:-4px;
background:#ffd24d;
color:#4d3700;
border:2px solid #fff;
border-radius:15px;
min-width:24px;
height:24px;
display:grid;
place-items:center;
font-size:10px;
font-weight:1000;
}

.house{
left:425px;
top:105px;
}

.coop{
left:705px;
top:180px;
}

.barn{
left:720px;
top:350px;
}

.mill{
left:145px;
top:270px;
}

.bakery{
left:245px;
top:355px;
}

.dairy{
left:565px;
top:405px;
}

.worker{
left:830px;
top:220px;
}

.tractor{
left:430px;
top:400px;
}

.orchard{
left:825px;
top:385px;
}

/* HUD */

.hud{
position:absolute;
z-index:30;
}

.topHud{
left:12px;
right:12px;
top:calc(8px + env(safe-area-inset-top));
display:flex;
justify-content:space-between;
align-items:flex-start;
}

.chip{
background:#244e2de8;
border:2px solid #f4e5a8;
border-radius:18px;
box-shadow:0 5px #17371f;
color:#fff;
}

.profile{
padding:6px 10px;
display:flex;
gap:8px;
align-items:center;
}

.avatar{
font-size:29px;
}

.lvl{
font-size:10px;
font-weight:1000;
}

.xpbar{
width:135px;
height:8px;
border-radius:8px;
background:#17361c;
overflow:hidden;
display:block;
}

.xpfill{
height:100%;
background:#b6ed61;
display:block;
}

.money{
padding:10px 13px;
font-weight:1000;
}

.zone{
position:absolute;
left:50%;
transform:translateX(-50%);
display:flex;
gap:4px;
padding:4px;
}

.zone button{
border:0;
border-radius:11px;
padding:7px 10px;
background:#427146;
color:#fff;
font-size:9px;
font-weight:1000;
}

.zone button.active{
background:#f0c949;
color:#4b3a12;
}

.rightHud{
right:12px;
top:100px;
display:flex;
flex-direction:column;
gap:8px;
}

.hbtn,.bbtn{
border:2px solid #fff0b8;
background:#356d40;
color:#fff;
border-radius:15px;
box-shadow:0 4px #1e4929;
font-weight:1000;
}

.hbtn{
width:52px;
height:52px;
font-size:21px;
}

.hbtn small,.bbtn small{
display:block;
font-size:7px;
}

.bottomHud{
left:50%;
bottom:calc(10px + env(safe-area-inset-bottom));
transform:translateX(-50%);
display:flex;
gap:7px;
}

.bbtn{
min-width:67px;
height:47px;
font-size:18px;
}

.soundGame{
left:12px;
bottom:calc(10px + env(safe-area-inset-bottom));
width:44px;
height:44px;
}

.paintHint{
position:absolute;
z-index:35;
left:50%;
bottom:72px;
transform:translateX(-50%);
display:none;
background:#fff1ae;
color:#483a14;
border:2px solid #b18c28;
border-radius:20px;
padding:8px 13px;
font-size:10px;
font-weight:1000;
}

.paintHint.show{
display:block;
}

.paintHint b{
font-size:12px;
}

/* MODALES */

.modal{
display:none;
position:fixed;
inset:0;
z-index:100;
background:#0008;
align-items:center;
justify-content:center;
padding:18px;
}

.modal.show{
display:flex;
}

.sheet{
width:min(680px,90vw);
max-height:82vh;
overflow:auto;
background:#fff8dd;
color:#423b25;
border:4px solid #795b32;
border-radius:24px;
box-shadow:
0 13px #523a20,
0 22px 45px #0007;
padding:14px;
transition:transform .18s;
}

.sheet.drag{
transition:none;
}

.sheetHead{
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
background:#fff8dd;
padding-bottom:8px;
z-index:2;
}

.sheet h2{
margin:0;
font-size:20px;
}

.close{
width:38px;
height:38px;
border:0;
border-radius:50%;
background:#b84d40;
color:#fff;
font-weight:1000;
}

.grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:8px;
}

.card{
background:#fff;
border:2px solid #ddca94;
border-radius:15px;
padding:10px;
}

.title{
font-weight:1000;
}

.small{
font-size:10px;
color:#72684d;
line-height:1.4;
}

.stat{
background:#f3ebcf;
border-radius:10px;
padding:8px;
margin:6px 0;
font-size:11px;
}

.btn{
border:0;
border-radius:12px;
padding:10px;
background:#5da840;
color:#fff;
font-weight:1000;
}

.btn.blue{
background:#5d99c5;
}

.btn.gold{
background:#efc344;
color:#543d0c;
}

.btn.orange{
background:#e89532;
}

.btn.dark{
background:#6a705f;
}

.btn:disabled{
opacity:.45;
}

.full{
width:100%;
}

.row{
display:flex;
gap:7px;
align-items:center;
flex-wrap:wrap;
}

.grow{
flex:1;
}

.cropGrid,
.stockGrid,
.marketGrid{
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
gap:8px;
}

.cropBtn{
border:0;
border-radius:13px;
background:#65ad46;
color:#fff;
padding:10px 5px;
font-weight:1000;
min-height:62px;
}

.cropBtn:disabled{
background:#777;
opacity:.5;
}

.cropBtn small{
display:block;
font-size:8px;
font-weight:400;
margin-top:3px;
}

/* UI */

.toast{
display:none;
position:fixed;
z-index:200;
top:70px;
left:50%;
transform:translateX(-50%);
background:#1d4025;
color:#fff;
border:2px solid #f3e4aa;
border-radius:13px;
padding:9px 14px;
font-size:11px;
font-weight:1000;
}

.toast.show{
display:block;
}

.float{
position:fixed;
z-index:210;
left:50%;
top:45%;
transform:translate(-50%,-50%);
font-size:24px;
font-weight:1000;
color:#fff;
text-shadow:0 3px #315b31;
animation:float 1s forwards;
}

@keyframes float{
to{
opacity:0;
transform:translate(-50%,-65px);
}
}

@media(max-width:700px){

.xpbar{
width:95px;
}

.rightHud{
top:88px;
}

.hbtn{
width:46px;
height:46px;
}

.bbtn{
min-width:56px;
height:43px;
}

.grid{
grid-template-columns:1fr;
}

.cropGrid,
.stockGrid,
.marketGrid{
grid-template-columns:repeat(2,1fr);
}

}
</style>
</head>

function initAudio(){

if(
!audio
){

try{

const AudioClass=

window.AudioContext

||

window.webkitAudioContext;


if(
AudioClass
){

audio=

new AudioClass();

}

}
catch(error){}

}


if(
audio?.state==="suspended"
){

audio.resume();

}

}


function tone(
frequency=520,
duration=.06
){

if(
!sound
){

return;

}


initAudio();


if(
!audio
){

return;

}


const oscillator=

audio.createOscillator();


const gain=

audio.createGain();


oscillator.frequency.value=
frequency;


gain.gain.setValueAtTime(

.001,

audio.currentTime

);


gain.gain.exponentialRampToValueAtTime(

.07,

audio.currentTime+
.01

);


gain.gain.exponentialRampToValueAtTime(

.001,

audio.currentTime+
duration

);


oscillator.connect(
gain
);


gain.connect(
audio.destination
);


oscillator.start();


oscillator.stop(

audio.currentTime

+

duration

+

.02

);

}

/* =====================================
CORRECTION GLISSEMENT RAPIDE

On analyse aussi tous les points situés
entre l'ancienne position et la nouvelle.
===================================== */

function paintAlong(
x1,
y1,
x2,
y2
){

const dx=

x2-
x1;


const dy=

y2-
y1;


const distance=

Math.hypot(
dx,
dy
);


/*
Un point tous les 10 pixels environ.
Ça permet de ne pas sauter une parcelle
quand le doigt va rapidement.
*/

const steps=

Math.max(

1,

Math.ceil(
distance/
10
)

);


for(

let step=0;

step<=steps;

step++

){

const ratio=

step/
steps;


paintAtPoint(

x1+
dx*
ratio,

y1+
dy*
ratio

);

}

}

value+=

return{

quantity

"barnBought"
],

mill:[
10000,
12,

15000,
13,
"bakeryBought"
],

dairy:[
18000,
15,
"dairyBought"
]

type
];


if(

!config

||

S[
config[2]
]

||

S.level<
config[1]

);

type==="bakery"

&&

!S.millBought

){

"Moulin requis"
);

}

type==="dairy"

&&

!S.barnBought

){

"Étable requise"
);

}

S.money<
config[0]
){

return fail(
"Pas assez d’argent"
);

S.money-=
config[0];


S[
config[2]
]=
true;


const now=
Date.now();


if(
type==="coop"
){

S.coopLastProduction=
now;

}


if(
type==="barn"
){

S.cowLastProduction=
now;


S.pigLastProduction=
now;

}


if(
type==="mill"
){

S.millLastProduction=
now;

}


if(
type==="bakery"
){

S.bakeryLastProduction=
now;

}


if(
type==="dairy"
){

S.dairyLastProduction=
now;

}


tone(
450,
.1
);


render();

openShop();

}

function openModal(

){

body;

/*
keepPending = true est utilisé après le choix
de culture pour conserver le mode plantation.
*/

function closeModal(
keepPending=false
){

const modal=

document.getElementById(
"modal"
);


const sheet=

document.getElementById(
"sheet"
);


modal.classList.remove(
"show"
);


sheet.classList.remove(
"drag"
);


sheet.style.transform=
"";


if(
!keepPending
){

pending=
null;

}

}


/* FERMETURE FOND */

document.getElementById(
"modal"
).addEventListener(

"click",

event=>{


if(
event.target.id==="modal"
){

closeModal();

}

}

);


/* ================================
SWIPE DOWN MODAL
================================ */

const sheet=

document.getElementById(
"sheet"
);


let swipeStartY=
0;


let swipeDistance=
0;


let canSwipe=
false;


sheet.addEventListener(

"touchstart",

event=>{


if(
event.touches.length===1
){

swipeStartY=

event.touches[0].clientY;


swipeDistance=
0;


canSwipe=

sheet.scrollTop<=0;

}

},

{
passive:true
}

);


sheet.addEventListener(

"touchmove",

event=>{


if(

!canSwipe

||

event.touches.length!==1

){

return;

}


const distance=

event.touches[0].clientY

-

swipeStartY;


if(
distance<8
){

return;

}


event.preventDefault();


swipeDistance=
distance;


sheet.classList.add(
"drag"
);


sheet.style.transform=

`translateY(${Math.min(distance,250)}px)`;

},

{
passive:false
}

);


sheet.addEventListener(

"touchend",

()=>{


if(

canSwipe

&&

swipeDistance>90

){

sheet.style.transform=

"translateY(120%)";


setTimeout(

()=>closeModal(),

180

);

}

else{

sheet.style.transform=
"";

}


sheet.classList.remove(
"drag"
);


canSwipe=
false;


swipeDistance=
0;

}

);

);

);

);

setTimeout(

()=>{

toast.classList.remove(
"show"
);

},

1400

);

}

);

}
