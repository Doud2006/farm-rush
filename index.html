<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Farm Rush</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#dff1c9;
    color:#26351e;
}

button{
    font-family:inherit;
    cursor:pointer;
}

#app{
    max-width:480px;
    margin:auto;
    min-height:100vh;
    background:linear-gradient(#a8db7c,#eef7df);
}

/* ACCUEIL */

#home{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:25px;
    text-align:center;
}

.logo{
    font-size:75px;
}

h1{
    margin:5px 0;
    font-size:44px;
    color:#315d2d;
}

.subtitle{
    color:#58744e;
    margin-bottom:35px;
}

.play{
    width:100%;
    max-width:330px;
    padding:17px;
    border:0;
    border-radius:16px;
    background:#67b53b;
    color:white;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 4px #47852a;
}

/* JEU */

#game{
    display:none;
    padding-bottom:75px;
}

header{
    background:#294c29;
    color:white;
    padding:10px;
    position:sticky;
    top:0;
    z-index:5;
}

.top{
    display:flex;
    align-items:center;
    gap:9px;
}

.avatar{
    width:50px;
    height:50px;
    background:#f4bd56;
    border-radius:13px;
    display:grid;
    place-items:center;
    font-size:28px;
}

.player{
    flex:1;
}

.player b{
    font-size:13px;
}

.xpbar{
    width:145px;
    height:7px;
    background:#152f19;
    border-radius:10px;
    overflow:hidden;
    margin-top:3px;
}

.xpfill{
    height:100%;
    width:0%;
    background:#8ee052;
}

.money{
    background:#17371d;
    padding:9px;
    border-radius:9px;
    font-weight:bold;
}

main{
    padding:10px;
}

.panel{
    background:#fff9e9;
    border:2px solid #b9955b;
    border-radius:15px;
    padding:10px;
    margin-bottom:10px;
}

/* FERME */

.farm{
    height:430px;
    position:relative;
    overflow:hidden;
    border:3px solid #68984e;
    border-radius:18px;
    background:linear-gradient(#91d36e 0 52%,#70b957 52%);
}

.house{
    position:absolute;
    top:20px;
    left:25%;
    font-size:70px;
}

.barn{
    position:absolute;
    top:85px;
    right:8%;
    font-size:50px;
}

.sign{
    position:absolute;
    top:130px;
    left:7%;
    background:#f3dda8;
    border:2px solid #8b6333;
    border-radius:8px;
    padding:5px 8px;
    font-size:11px;
    font-weight:bold;
}

.fields{
    position:absolute;
    bottom:12px;
    left:12px;
    right:12px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
}

.plot{
    aspect-ratio:1;
    background:#87572f;
    border:3px solid #633e20;
    border-radius:10px;
    display:grid;
    place-items:center;
    position:relative;
    color:white;
    font-size:28px;
}

.locked{
    background:#6b6b61;
    font-size:20px;
}

.timer{
    position:absolute;
    top:3px;
    left:3px;
    right:3px;
    background:white;
    color:#333;
    border-radius:5px;
    text-align:center;
    font-size:10px;
    font-weight:bold;
    padding:2px;
}

.ready{
    background:#ffd044;
    color:#5b3a00;
    border:2px solid white;
    border-radius:8px;
    padding:6px;
    font-size:10px;
    font-weight:bold;
}

/* BOUTONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:9px 0;
}

.btn{
    border:0;
    border-radius:13px;
    padding:13px 8px;
    background:#69b63b;
    color:white;
    font-weight:bold;
}

.orange{
    background:#ef9826;
}

.dark{
    background:#52604d;
}

.full{
    width:100%;
}

/* COMMANDES */

.orders{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:8px;
}

.order{
    background:white;
    border:1px solid #d7c69d;
    border-radius:10px;
    padding:8px;
    font-size:11px;
}

.reward{
    color:#a66a00;
    font-weight:bold;
    margin:5px 0;
}

.order button{
    width:100%;
    padding:7px;
    font-size:10px;
}

.order button:disabled{
    opacity:.4;
}

/* STOCK */

.stock{
    font-size:12px;
    line-height:1.8;
}

/* NAVIGATION */

.nav{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:#493c2c;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    z-index:10;
}

.nav button{
    border:0;
    background:none;
    color:white;
    padding:8px;
    font-size:10px;
    font-weight:bold;
}

.nav span{
    display:block;
    font-size:21px;
}

/* MODALE */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:20;
    align-items:flex-end;
}

.modal.show{
    display:flex;
}

.sheet{
    width:100%;
    max-width:480px;
    margin:auto 0 0;
    background:#fff9e9;
    border-radius:20px 20px 0 0;
    padding:16px;
    max-height:80vh;
    overflow:auto;
}

.crops{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.cropButton{
    border:0;
    border-radius:12px;
    padding:12px 5px;
    background:#69b63b;
    color:white;
    font-weight:bold;
}

.cropButton:disabled{
    background:#777;
    opacity:.5;
}

.toast{
    display:none;
    position:fixed;
    top:75px;
    left:50%;
    transform:translateX(-50%);
    background:#203a20;
    color:white;
    padding:10px 16px;
    border-radius:12px;
    z-index:30;
    font-weight:bold;
}

.toast.show{
    display:block;
}
</style>
</head>

<body>

<div id="app">

<!-- ACCUEIL -->

<section id="home">
    <div class="logo">🌱</div>
    <h1>FARM RUSH</h1>
    <div class="subtitle">
        Construis ta ferme,<br>
        une récolte à la fois.
    </div>

    <button class="play" onclick="startGame()">
        ▶ JOUER
    </button>

    <p style="font-size:11px;color:#688060;margin-top:20px">
        Prototype V1.0
    </p>
</section>


<!-- JEU -->

<section id="game">

<header>
    <div class="top">

        <div class="avatar">👨‍🌾</div>

        <div class="player">
            <b>FERMIER — NIVEAU <span id="level">1</span></b>

            <div style="font-size:10px">
                XP <span id="xp">0</span>/<span id="xpNeed">100</span>
            </div>

            <div class="xpbar">
                <div id="xpFill" class="xpfill"></div>
            </div>
        </div>

        <div class="money">
            🪙 <span id="money">100</span>
        </div>

    </div>
</header>


<main>

<!-- COMMANDES -->

<div class="panel">

    <b>📋 COMMANDES</b>

    <div id="orders" class="orders"></div>

</div>


<!-- FERME -->

<div class="farm">

    <div class="house">🏡</div>

    <div class="barn">🏠</div>

    <div class="sign">
        Bienvenue à la ferme !
    </div>

    <div id="fields" class="fields"></div>

</div>


<!-- ACTIONS -->

<div class="actions">

    <button class="btn" onclick="plantFirstEmpty()">
        🌱 PLANTER
    </button>

    <button class="btn orange" onclick="harvestAll()">
        🌾 RÉCOLTER <span id="ready">0</span>
    </button>

</div>


<!-- PARCELLES -->

<div class="panel">

    <div>
        <b>🏡 AGRANDIR LA FERME</b>

        <span style="float:right">
            <span id="plotCount">4</span>/20
        </span>
    </div>

    <button
        class="btn full"
        style="margin-top:8px"
        onclick="buyPlot()">

        ➕ Nouvelle parcelle —
        <span id="plotCost">100</span> 🪙

    </button>

</div>


<!-- STOCK -->

<div class="panel">

    <b>📦 STOCK</b>

    <div id="stock" class="stock"></div>

</div>

</main>


<!-- NAVIGATION -->

<nav class="nav">

    <button onclick="window.scrollTo(0,0)">
        <span>🏡</span>
        FERME
    </button>

    <button onclick="showHelp()">
        <span>❔</span>
        AIDE
    </button>

    <button onclick="goHome()">
        <span>🚪</span>
        QUITTER
    </button>

</nav>

</section>

</div>


<!-- MODALE -->

<div id="modal" class="modal">

    <div class="sheet">

        <h2 id="modalTitle"></h2>

        <div id="modalBody"></div>

        <button
            class="btn dark full"
            onclick="closeModal()"
            style="margin-top:10px">

            FERMER

        </button>

    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================
   CULTURES
========================= */

const CROPS = {

    wheat:{
        icon:"🌾",
        name:"Blé",
        time:5,
        cost:5,
        sell:10,
        xp:2,
        level:1
    },

    carrot:{
        icon:"🥕",
        name:"Carotte",
        time:15,
        cost:12,
        sell:27,
        xp:3,
        level:2
    },

    tomato:{
        icon:"🍅",
        name:"Tomate",
        time:30,
        cost:25,
        sell:60,
        xp:5,
        level:4
    },

    corn:{
        icon:"🌽",
        name:"Maïs",
        time:60,
        cost:50,
        sell:125,
        xp:7,
        level:7
    }

};


/* =========================
   DONNÉES DU JOUEUR
========================= */

let state = {

    money:100,

    level:1,

    xp:0,

    plots:4,

    fields:Array(20).fill(null),

    stock:{
        wheat:0,
        carrot:0,
        tomato:0,
        corn:0
    },

    orders:[]

};


/* =========================
   COMMANDES
========================= */

const INITIAL_ORDERS = [

    {
        crop:"wheat",
        qty:5,
        reward:70,
        xp:10
    },

    {
        crop:"carrot",
        qty:3,
        reward:100,
        xp:15
    },

    {
        crop:"wheat",
        qty:10,
        reward:130,
        xp:20
    }

];


/* =========================
   SAUVEGARDE
========================= */

function saveGame(){

    localStorage.setItem(
        "farmRushV1",
        JSON.stringify(state)
    );

}


function loadGame(){

    const saved =
        localStorage.getItem("farmRushV1");

    if(saved){

        try{

            state = JSON.parse(saved);

        }catch(e){

            console.log("Erreur sauvegarde");

        }

    }

    if(!state.orders || state.orders.length === 0){

        state.orders =
            JSON.parse(
                JSON.stringify(INITIAL_ORDERS)
            );

    }

}


/* =========================
   NIVEAUX
========================= */

function xpRequired(){

    return Math.floor(
        100 * Math.pow(1.28,state.level-1)
    );

}


function addXP(amount){

    state.xp += amount;

    while(
        state.xp >= xpRequired() &&
        state.level < 20
    ){

        state.xp -= xpRequired();

        state.level++;

        toast(
            "⭐ Niveau "
            + state.level
            + " !"
        );

    }

    saveGame();

}


/* =========================
   UTILITAIRES
========================= */

function unlocked(crop){

    return state.level >= CROPS[crop].level;

}


function formatTime(seconds){

    if(seconds < 60){

        return seconds + "s";

    }

    const minutes =
        Math.floor(seconds/60);

    const sec =
        seconds % 60;

    return (
        minutes
        + "m "
        + String(sec).padStart(2,"0")
        + "s"
    );

}


/* =========================
   DÉMARRER
========================= */

function startGame(){

    document.getElementById("home")
        .style.display="none";

    document.getElementById("game")
        .style.display="block";

    render();

}


/* =========================
   RETOUR ACCUEIL
========================= */

function goHome(){

    document.getElementById("game")
        .style.display="none";

    document.getElementById("home")
        .style.display="flex";

}


/* =========================
   AFFICHAGE
========================= */

function render(){

    document.getElementById("money")
        .textContent =
        Math.floor(state.money);

    document.getElementById("level")
        .textContent =
        state.level;

    document.getElementById("xp")
        .textContent =
        state.xp;

    document.getElementById("xpNeed")
        .textContent =
        xpRequired();

    document.getElementById("xpFill")
        .style.width =
        (state.xp / xpRequired() * 100)
        + "%";

    document.getElementById("plotCount")
        .textContent =
        state.plots;

    document.getElementById("plotCost")
        .textContent =
        plotCost();


    renderFields();

    renderOrders();

    renderStock();

    saveGame();

}


/* =========================
   PARCELLES
========================= */

function renderFields(){

    const container =
        document.getElementById("fields");

    container.innerHTML="";

    let ready = 0;


    state.fields.forEach(
        (field,index)=>{

            const plot =
                document.createElement("div");

            plot.className="plot";


            /* PARCELLE VERROUILLÉE */

            if(index >= state.plots){

                plot.classList.add("locked");

                plot.textContent="🔒";

                container.appendChild(plot);

                return;

            }


            /* PARCELLE VIDE */

            if(!field){

                plot.textContent="🌱";

                plot.onclick =
                    ()=>openSeeds(index);

                container.appendChild(plot);

                return;

            }


            /* CULTURE */

            const crop =
                CROPS[field.crop];

            const remaining =
                Math.max(
                    0,
                    Math.ceil(
                        (field.ready - Date.now())
                        /1000
                    )
                );


            /* PRÊTE */

            if(remaining <= 0){

                ready++;

                plot.innerHTML =
                    '<div class="ready">'
                    + '🌾 RÉCOLTER'
                    + '</div>';

                plot.onclick =
                    ()=>harvest(index);

            }


            /* EN CROISSANCE */

            else{

                plot.innerHTML =
                    '<div>'
                    + crop.icon
                    + '</div>'
                    +
                    '<div class="timer">'
                    + formatTime(remaining)
                    + '</div>';

            }


            container.appendChild(plot);

        }
    );


    document.getElementById("ready")
        .textContent =
        "(" + ready + ")";

}


/* =========================
   PLANTER
========================= */

function plantFirstEmpty(){

    const index =
        state.fields.findIndex(
            (field,i)=>
                i < state.plots &&
                !field
        );


    if(index === -1){

        toast(
            "Toutes les parcelles sont occupées !"
        );

        return;

    }


    openSeeds(index);

}


function openSeeds(index){

    let html =
        "<p>Choisis une culture :</p>";

    html +=
        '<div class="crops">';


    for(const key in CROPS){

        const crop =
            CROPS[key];

        const available =
            unlocked(key);


        html +=

        '<button '
        + 'class="cropButton" '
        + (available
            ? 'onclick="plant('
              + index
              + ',\''+key+'\')"'
            : 'disabled')
        + '>'

        + crop.icon
        + " "
        + crop.name

        + "<br>"

        + "<small>"
        + formatTime(crop.time)
        + " • "
        + crop.cost
        + " 🪙"

        + (available
            ? ""
            : " • Niveau "
              + crop.level)

        + "</small>"

        + "</button>";

    }


    html += "</div>";

    openModal(
        "🌱 Planter",
        html
    );

}


function plant(index,key){

    const crop =
        CROPS[key];


    if(state.money < crop.cost){

        toast(
            "Pas assez d'argent."
        );

        return;

    }


    state.money -= crop.cost;


    state.fields[index] = {

        crop:key,

        ready:
            Date.now()
            + crop.time * 1000

    };


    closeModal();


    toast(
        crop.icon
        + " "
        + crop.name
        + " planté !"
    );


    render();

}


/* =========================
   RÉCOLTE
========================= */

function harvest(index){

    const field =
        state.fields[index];


    if(
        !field ||
        field.ready > Date.now()
    ){

        return;

    }


    const crop =
        CROPS[field.crop];


    state.money += crop.sell;


    state.stock[field.crop] =
        (state.stock[field.crop] || 0)
        + 1;


    state.fields[index] = null;


    addXP(crop.xp);


    toast(
        crop.icon
        + " Récolté ! +"
        + crop.sell
        + " 🪙"
    );


    render();

}


function harvestAll(){

    let count=0;


    state.fields.forEach(
        (field,index)=>{

            if(
                field &&
                field.ready <= Date.now()
            ){

                harvest(index);

                count++;

            }

        }
    );


    if(count === 0){

        toast(
            "Aucune culture prête."
        );

    }

}


/* =========================
   PARCELLES
========================= */

function plotCost(){

    return Math.floor(
        100 *
        Math.pow(
            1.42,
            state.plots - 4
        )
    );

}


function buyPlot(){

    if(state.plots >= 20){

        toast(
            "Maximum de parcelles atteint."
        );

        return;

    }


    const cost =
        plotCost();


    if(state.money < cost){

        toast(
            "Il te manque "
            + (cost - Math.floor(state.money))
            + " 🪙"
        );

        return;

    }


    state.money -= cost;

    state.plots++;


    addXP(10);


    toast(
        "🏡 Nouvelle parcelle !"
    );


    render();

}


/* =========================
   COMMANDES
========================= */

function renderOrders(){

    const container =
        document.getElementById("orders");

    container.innerHTML="";


    state.orders.forEach(
        (order,index)=>{

            if(!order)return;


            const crop =
                CROPS[order.crop];

            const amount =
                state.stock[order.crop] || 0;

            const possible =
                amount >= order.qty;


            const div =
                document.createElement("div");

            div.className="order";


            div.innerHTML =

                "<b>"
                + crop.icon
                + " "
                + crop.name
                + "</b>"

                + "<br>"

                + Math.min(
                    amount,
                    order.qty
                )
                + "/"
                + order.qty

                + '<div class="reward">'
                + "🪙 "
                + order.reward
                + " • ⭐ "
                + order.xp
                + "</div>"

                + '<button class="btn" '
                + (
                    possible
                    ? ""
                    : "disabled"
                )
                + ' onclick="deliver('
                + index
                + ')">'

                + "LIVRER"

                + "</button>";


            container.appendChild(div);

        }
    );

}


/* =========================
   LIVRER
========================= */

function deliver(index){

    const order =
        state.orders[index];


    if(!order)return;


    const amount =
        state.stock[order.crop] || 0;


    if(amount < order.qty){

        toast(
            "Il manque des récoltes."
        );

        return;

    }


    state.stock[order.crop]
        -= order.qty;


    state.money +=
        order.reward;


    addXP(
        order.xp
    );


    /*
      Nouvelle commande
    */

    const available =
        Object.keys(CROPS)
        .filter(unlocked);


    const key =
        available[
            Math.floor(
                Math.random()
                * available.length
            )
        ];


    const crop =
        CROPS[key];


    state.orders[index] = {

        crop:key,

        qty:
            key === "wheat"
            ? 5
            : 3,

        reward:
            crop.sell * 4,

        xp:
            crop.xp * 3

    };


    toast(
        "📦 Commande livrée !"
    );


    render();

}


/* =========================
   STOCK
========================= */

function renderStock(){

    const container =
        document.getElementById("stock");

    container.innerHTML="";


    for(const key in CROPS){

        const crop =
            CROPS[key];

        container.innerHTML +=

            crop.icon
            + " "
            + crop.name
            + " : <b>"
            + (state.stock[key] || 0)
            + "</b><br>";

    }

}


/* =========================
   AIDE
========================= */

function showHelp(){

    openModal(

        "❔ Comment jouer",

        "<p>🌱 <b>1.</b> Appuie sur une parcelle vide.</p>"
        +
        "<p>🌾 <b>2.</b> Choisis une culture.</p>"
        +
        "<p>⏱️ <b>3.</b> Attends qu'elle pousse.</p>"
        +
        "<p>🪙 <b>4.</b> Récolte pour gagner de l'argent.</p>"
        +
        "<p>📋 <b>5.</b> Remplis les commandes.</p>"
        +
        "<p>🏡 <b>6.</b> Achète de nouvelles parcelles.</p>"
        +
        "<p>⭐ Monte de niveau pour débloquer de nouvelles cultures.</p>"
        +
        "<p>💾 La partie est sauvegardée automatiquement.</p>"

    );

}


/* =========================
   MODALE
========================= */

function openModal(title,body){

    document.getElementById("modalTitle")
        .textContent=title;

    document.getElementById("modalBody")
        .innerHTML=body;

    document.getElementById("modal")
        .classList.add("show");

}


function closeModal(){

    document.getElementById("modal")
        .classList.remove("show");

}


/* =========================
   MESSAGE
========================= */

function toast(message){

    const element =
        document.getElementById("toast");


    element.textContent =
        message;


    element.classList.add("show");


    setTimeout(
        ()=>{
            element.classList.remove("show");
        },
        1500
    );

}


/* =========================
   ACTUALISATION
========================= */

setInterval(
    render,
    1000
);


/* =========================
   CHARGEMENT
